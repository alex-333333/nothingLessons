name: Build

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

# Only the newest push publishes the "latest" release; an older run still going is cancelled.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test core and build release APK
        run: ./gradlew :core:test :app:assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: nothing-lessons-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Prepare release asset
        if: github.event_name == 'push'
        run: cp app/build/outputs/apk/release/app-release.apk nothing-lessons.apk

      # The "latest" tag is moved to this commit, then its release is created or updated in place.
      - name: Move the latest tag
        if: github.event_name == 'push'
        run: |
          git tag -f latest
          git push -f origin refs/tags/latest

      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          tag_name: latest
          name: Последняя сборка
          prerelease: false
          make_latest: true
          files: nothing-lessons.apk
